<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="mensagem"></div>
    <div id="contador">
      <ul>
        <div>
          <label for="total">total:</label>
          <li class="total"></li>
        </div>
        <div>
          <label for="pendentes">pendentes</label>
          <li class="pendentes"></li>
        </div>
        <div>
          <label for="concluidos">concluidos</label>
          <li class="concluidos"></li>
        </div>
      </ul>
    </div>
    <header>
      <h1>Lista de Tarefas</h1>
      <label for="textoAdd">Tarefa</label>
      <input id="textoAdd" type="text" />
      <input
        id="botaoAdd"
        onclick="addTarefa()"
        type="button"
        value="Adicionar"
      />
    </header>
    <div id="lista">
      <ul id="listaTarefas"></ul>
    </div>
    <button id="excluirCon">Excluir Concluidas</button>
    <script src="script.js"></script>
  </body>
</html>
