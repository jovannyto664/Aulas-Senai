<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divisão segura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Calculadora de divisão</h1>

    <label for="dividendo">Número que será dividido</label>
    <input id="dividendo" type="number" placeholder="Ex.: 20">

    <label for="divisor">Número que irá dividir</label>
    <input id="divisor" type="number" placeholder="Ex.: 4">

    <button id="btn-calcular">Calcular</button>

    <p id="resultado" class="mensagem">
      Informe os dois números.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
