<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro para o torneio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Inscrição no torneio</h1>

    <label for="nome">Nome</label>
    <input id="nome" type="text" placeholder="Ex.: Rafael">

    <label for="idade">Idade</label>
    <input id="idade" type="number" placeholder="Ex.: 16">

    <button id="btn-cadastrar">Realizar inscrição</button>

    <p id="mensagem" class="mensagem">
      Preencha os dados.
    </p>

    <p id="status">Status do botão: liberado</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
