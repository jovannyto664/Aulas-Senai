<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de animais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="catalogo">
    <h1>Catálogo de animais</h1>

    <article class="cartao">
      <h2 id="nome-animal">Leão</h2>
      <p><strong>Habitat:</strong> <span id="habitat-animal">Savana</span></p>
      <p><strong>Alimentação:</strong> <span id="alimentacao-animal">Carnívoro</span></p>
    </article>

    <p id="posicao">Animal 1 de 3</p>

    <div class="botoes">
      <button id="btn-anterior">Anterior</button>
      <button id="btn-proximo">Próximo</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
