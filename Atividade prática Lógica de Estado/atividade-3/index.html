<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar da gincana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Placar da gincana</h1>

    <section class="times">
      <div class="time azul">
        <h2>Time Azul</h2>
        <p id="pontos-azul">0</p>
        <button id="btn-azul">+1 ponto</button>
      </div>

      <div class="time verde">
        <h2>Time Verde</h2>
        <p id="pontos-verde">0</p>
        <button id="btn-verde">+1 ponto</button>
      </div>
    </section>

    <p>Total de pontos: <strong id="total-pontos">0</strong></p>
    <p id="mensagem-lider">A disputa está empatada.</p>

    <button id="btn-zerar">Zerar placar</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
