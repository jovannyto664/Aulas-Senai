<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="placar">
    <h1>Placar da turma</h1>

    <p>Pontos: <strong id="numero-pontos">0</strong></p>

    <div class="botoes">
      <button id="btn-aumentar">Adicionar ponto</button>
      <button id="btn-diminuir">Retirar ponto</button>
      <button id="btn-zerar">Zerar placar</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
