<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Preferências</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Painel de Preferências</h1>

        <form id="form-preferencias">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="tema">Tema preferido</label>
            <input type="text" id="tema" placeholder="Claro, escuro, azul, verde ou outro">

            <label for="linguagem">Linguagem favorita</label>
            <select id="linguagem">
                <option value="">Selecione uma opção</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="C#">C#</option>
                <option value="Outra">Outra</option>
            </select>

            <label for="observacao">Observação pessoal</label>
            <textarea id="observacao" placeholder="Comente uma observação pessoal sua"></textarea>

            <div class="botoes">
                <button type="button" id="btn-salvar">Salvar preferências</button>
                <button type="button" id="btn-apagar">Apagar preferências</button>
            </div>
        </form>

        <section class="resumo">
            <h2>Resumo das preferências</h2>
            <div id="resumoJSON">
                <p>Nenhuma preferência salva ainda.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
